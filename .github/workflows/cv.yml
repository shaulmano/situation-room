name: CV requests

# הצד שמחבר בין הכפתור בחדר המצב לבין קלוד.
#
# הדרך הראשונה שנבנתה היתה מחבר Supabase בתוך קלוד, והיא נפלה על שני דברים:
# מחבר מאפשר ארגון אחד בלבד, והארגון של חדר המצב אינו זה של manomatic, וניסיון
# להוסיף מחבר שני נתקע כי הרשת של שאול לא מגיעה ל-api.supabase.com, ושם יושב
# מסך האישור.
#
# לרנר של GitHub אין את הבעיה: הוא כבר כותב מכאן למסד בכל סריקה. לכן קלוד
# מפעיל את הוורקפלו הזה במקום לדבר עם המסד בעצמו.
#
#   mode=fetch   מדפיס את הבקשה הממתינה הבאה עם תיאור המשרה וגרסת הבסיס.
#                קלוד קורא את זה מיומן הריצה.
#   mode=render  מקבל את התוכן שקלוד כתב, מרנדר PDF וכותב אותו לשורה.
#
# ידני בלבד. אין כאן שעון: הבקשה מגיעה מלחיצה של שאול, וקלוד הוא שמפעיל.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'fetch, render, audit, dismissals, migrate, query, checkapi, referrals, referral_pdf, referral_mark, mail_selftest or mail_send'
        required: true
        default: 'fetch'
      migration:
        description: 'path to a .sql file (migrate only)'
        required: false
      query:
        description: 'a read-only select (query only)'
        required: false
      request_id:
        description: 'cv_requests.id (render only)'
        required: false
      filename:
        description: 'Shaul_Mano_Role.pdf (render only)'
        required: false
      content:
        description: 'JSON for tools/render_cv.mjs (render only)'
        required: false

# שתי ריצות על אותה בקשה היו כותבות שתי גרסאות לאותה שורה.
concurrency:
  group: situation-room-cv
  cancel-in-progress: false

jobs:
  cv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # רק למצב render. fetch הוא שאילתה אחת ולא צריך דפדפן, ומשיכת Chromium
      # לכל בדיקה אם יש בקשה היתה דקה שלמה על כלום.
      - uses: actions/setup-node@v4
        if: inputs.mode == 'render'
        with:
          node-version: '20'

      - name: Install Playwright
        if: inputs.mode == 'render'
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      # משווה את הגרסאות שכבר יוצרו. קריאה בלבד.
      - name: Audit the versions already produced
        if: inputs.mode == 'audit'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python sync/cv_requests.py audit 5

      # מה שאול סוגר ב-X. קריאה בלבד, לא משנה שום שורה.
      - name: What he closes with X
        if: inputs.mode == 'dismissals'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: cd sync && python dismiss_patterns.py

      # מיגרציה. עד 9.11.2026 כל שינוי סכימה הודבק ידנית ל-SQL editor
      # בדפדפן, כי קלוד לא ניגש למסד הזה. לרנר יש את המפתחות ממילא.
      - name: Run a migration
        if: inputs.mode == 'migrate'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          MIGRATION: ${{ inputs.migration }}
        run: python sync/migrate.py "$MIGRATION"

      # קריאה בלבד. נולד מ"מאיפה אתה מביא את המספר הזה", שאלה שלא הייתה
      # דרך לענות עליה בלי לבקש משאול לפתוח SQL editor בדפדפן.
      - name: Run a read-only query
        if: inputs.mode == 'query'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          QUERY: ${{ inputs.query }}
        run: python sync/query.py "$QUERY"

      # בודק מה PostgREST מחזיר לאתר, ולא מה שיש במסד. שאילתה ישירה
      # עוקפת אותו, ולכן היא לא יכולה לתפוס מטמון סכימה ישן.
      - name: Check what the API layer returns
        if: inputs.mode == 'checkapi'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python sync/check_api.py

      # פניות דרך מכרים. fetch מדפיס את מה שמחכה, pdf מוציא את הקובץ
      # לדיסק כדי לצרף אותו, ו-mark מעדכן אחרי שליחה.
      - name: Referrals
        if: startsWith(inputs.mode, 'referral')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          REF_ID: ${{ inputs.request_id }}
          REF_STATUS: ${{ inputs.filename }}
          REF_NOTE: ${{ inputs.content }}
        run: |
          case "${{ inputs.mode }}" in
            referrals)      python sync/referrals.py fetch ;;
            referral_mark)  python sync/referrals.py mark "$REF_ID" "$REF_STATUS" "$REF_NOTE" ;;
            referral_pdf)   python sync/referrals.py pdf "$REF_ID" ;;
            *) echo "unknown referral mode"; exit 1 ;;
          esac

      # 13.11.2026: שליחה ישירה מהג'ימייל של שאול. עד היום הכפתור "שלח"
      # רק סימן את השורה, והמייל יצא מהמשימה המתוזמנת עד שעה אחר כך.
      #
      # הסודות הם שלו ונוספו על ידו. הם לא מגיעים לשום מקום אחר, ושני
      # המצבים כאן הם היחידים שנוגעים בהם.
      - name: Send mail
        if: startsWith(inputs.mode, 'mail_')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          case "${{ inputs.mode }}" in
            mail_selftest) python sync/send_mail.py selftest ;;
            mail_send)     python sync/send_mail.py referrals ;;
            *) echo "unknown mail mode"; exit 1 ;;
          esac

      - name: Upload the attachment
        if: inputs.mode == 'referral_pdf'
        uses: actions/upload-artifact@v4
        with:
          name: referral-cv
          path: '*.pdf'
          if-no-files-found: error

      - name: Fetch the next pending request
        if: inputs.mode == 'fetch'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python sync/cv_requests.py fetch

      - name: Render and store the PDF
        if: inputs.mode == 'render'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CV_CONTENT: ${{ inputs.content }}
          CV_REQUEST_ID: ${{ inputs.request_id }}
          CV_FILENAME: ${{ inputs.filename }}
        run: |
          # דרך משתנה סביבה ולא דרך שורת הפקודה: התוכן הוא JSON עם מרכאות,
          # גרשים וסוגריים, ו-bash היה מפרק אותו.
          python -c "import os,io; io.open('content.json','w',encoding='utf-8').write(os.environ['CV_CONTENT'])"
          python sync/cv_requests.py render content.json "$CV_REQUEST_ID" "$CV_FILENAME"
