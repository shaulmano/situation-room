name: CV requests

# שם הריצה נושא את המצב, כדי שאפשר יהיה להבדיל בין ריצות מבחוץ.
#
# 14.11.2026: כל שתים עשרה הריצות האחרונות נקראו "CV requests", ולכן
# `gh run list` לא יכול לענות על "מתי רצה replies בפעם האחרונה". זאת
# בדיוק השאלה שבדיקת התקינות של סוכן התגובות שואלת כל שעה.
run-name: cv ${{ inputs.mode }}

# הצד שמחבר בין הכפתור בחדר המצב לבין קלוד.
#
# הדרך הראשונה שנבנתה היתה מחבר Supabase בתוך קלוד, והיא נפלה על שני דברים:
# מחבר מאפשר ארגון אחד בלבד, והארגון של חדר המצב אינו זה של manomatic, וניסיון
# להוסיף מחבר שני נתקע כי הרשת של שאול לא מגיעה ל-api.supabase.com, ושם יושב
# מסך האישור.
#
# לרנר של GitHub אין את הבעיה: הוא כבר כותב מכאן למסד בכל סריקה. לכן קלוד
# מפעיל את הוורקפלו הזה במקום לדבר עם המסד בעצמו.
#
#   mode=fetch   מדפיס את הבקשה הממתינה הבאה עם תיאור המשרה וגרסת הבסיס.
#                קלוד קורא את זה מיומן הריצה.
#   mode=render  מקבל את התוכן שקלוד כתב, מרנדר PDF וכותב אותו לשורה.
#
# ידני בלבד. אין כאן שעון: הבקשה מגיעה מלחיצה של שאול, וקלוד הוא שמפעיל.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'fetch, render, audit, dismissals, migrate, query, checkapi, poster, replies, referrals, referral_pdf, referral_mark, ats_mail, ats_mail_write, boards, boards_add, boards_probe, ats_discover, ats_read, messaged, pitched, rejections, rejections_write, mail_selftest, mail_test or mail_send'
        required: true
        default: 'fetch'
      migration:
        description: 'path to a .sql file (migrate only)'
        required: false
      query:
        description: 'a read-only select (query only)'
        required: false
      request_id:
        description: 'cv_requests.id (render only)'
        required: false
      filename:
        description: 'Shaul_Mano_Role.pdf (render only)'
        required: false
      content:
        description: 'JSON for tools/render_cv.mjs (render only)'
        required: false

# שתי ריצות על אותה בקשה היו כותבות שתי גרסאות לאותה שורה.
concurrency:
  group: situation-room-cv
  cancel-in-progress: false

jobs:
  cv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # רק למצב render. fetch הוא שאילתה אחת ולא צריך דפדפן, ומשיכת Chromium
      # לכל בדיקה אם יש בקשה היתה דקה שלמה על כלום.
      - uses: actions/setup-node@v4
        if: inputs.mode == 'render'
        with:
          node-version: '20'

      - name: Install Playwright
        if: inputs.mode == 'render'
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      # משווה את הגרסאות שכבר יוצרו. קריאה בלבד.
      - name: Audit the versions already produced
        if: inputs.mode == 'audit'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python sync/cv_requests.py audit 5

      # מה שאול סוגר ב-X. קריאה בלבד, לא משנה שום שורה.
      - name: What he closes with X
        if: inputs.mode == 'dismissals'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: cd sync && python dismiss_patterns.py

      # מיגרציה. עד 9.11.2026 כל שינוי סכימה הודבק ידנית ל-SQL editor
      # בדפדפן, כי קלוד לא ניגש למסד הזה. לרנר יש את המפתחות ממילא.
      - name: Run a migration
        if: inputs.mode == 'migrate'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          MIGRATION: ${{ inputs.migration }}
        run: python sync/migrate.py "$MIGRATION"

      # קריאה בלבד. נולד מ"מאיפה אתה מביא את המספר הזה", שאלה שלא הייתה
      # דרך לענות עליה בלי לבקש משאול לפתוח SQL editor בדפדפן.
      - name: Run a read-only query
        if: inputs.mode == 'query'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          QUERY: ${{ inputs.query }}
        run: python sync/query.py "$QUERY"

      # בודק מה PostgREST מחזיר לאתר, ולא מה שיש במסד. שאילתה ישירה
      # עוקפת אותו, ולכן היא לא יכולה לתפוס מטמון סכימה ישן.
      # מי פרסם את המודעה. 13.11.2026, באישור שאול. רץ רק על משרות שהוא כבר
      # הגיש אליהן: בקשה אחת למשרה שהוא באמת פנה אליה, במקום עשרים בקשות
      # ספקולטיביות לכל חיפוש, וזאת גם הדרך היחידה להגיע למשרה שנסרקה לפני
      # שבוע והוא הגיש אליה היום.
      - name: Fetch the job poster
        if: inputs.mode == 'poster'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          JOB_ID: ${{ inputs.request_id }}
        run: python sync/poster.py $JOB_ID

      # תגובות שהסוכן קרא בלינקדאין. 14.11.2026.
      #
      # הסוכן רץ מול הדפדפן של שאול ואין לו גישה למסד, ולכן הוא מעביר לכאן
      # את השורות ב-content, וכאן הן נרשמות ויוצא עליהן פוש אחד.
      #
      # שני צעדים בוורקפלו אחד בכוונה: רישום בלי התראה משאיר תגובה יושבת
      # בשקט, וזאת בדיוק הבעיה שהתחלנו ממנה.
      # 14.11.2026. "מתחת לרדאר": משרות שנמצאו בחיפוש הבוליאני בגוגל, לפי
      # המדריך ששאול שלח. גוגל לא עונה לראנר של GitHub, אבל כן עונה לקלוד,
      # ולכן המשימה המתוזמנת מחפשת ושולחת לכאן את מה שמצאה.
      #
      # score.py רץ מיד אחרי, באותו צעד: משרה שנכנסה ל-jobs בלי שורה
      # ב-matches אינה מוצגת במסכים שמצרפים אותן, בלי שום שגיאה. זאת
      # המלכודת שהפילה כאן את הלוח פעמיים.
      # 15.11.2026. מי שאישר בקשת חברות בלינקדאין. האישור מגיע במייל
      # מ-invitations@linkedin.com, והשם המלא יושב בשם התצוגה, ולכן הזיהוי
      # לא דורש לפתוח את לינקדאין בכלל.
      - name: Record LinkedIn invite acceptances
        if: inputs.mode == 'invites'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PAYLOAD: ${{ inputs.content }}
        run: python sync/invites_mark.py "$PAYLOAD"

      - name: Record under-the-radar jobs
        if: inputs.mode == 'seo'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PAYLOAD: ${{ inputs.content }}
        run: |
          python sync/seo_jobs.py "$PAYLOAD"
          python sync/score.py missing

      - name: Record LinkedIn replies
        if: inputs.mode == 'replies'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PAYLOAD: ${{ inputs.content }}
        run: |
          # cryptography: הפוש חותם VAPID ב-ES256, והוא לא מותקן בוורקפלו
          # הזה כברירת מחדל. 14.11.2026: הריצה הראשונה רשמה את התגובה
          # ונפלה בשליחה, כלומר השורה נשמרה ואף התראה לא יצאה.
          pip install cryptography
          python sync/replies_mark.py "$PAYLOAD"
          python sync/notify_push.py replies

      - name: Check what the API layer returns
        if: inputs.mode == 'checkapi'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python sync/check_api.py

      # פניות דרך מכרים. fetch מדפיס את מה שמחכה, pdf מוציא את הקובץ
      # לדיסק כדי לצרף אותו, ו-mark מעדכן אחרי שליחה.
      - name: Referrals
        if: startsWith(inputs.mode, 'referral')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          REF_ID: ${{ inputs.request_id }}
          REF_STATUS: ${{ inputs.filename }}
          REF_NOTE: ${{ inputs.content }}
        run: |
          case "${{ inputs.mode }}" in
            referrals)      python sync/referrals.py fetch ;;
            referral_mark)  python sync/referrals.py mark "$REF_ID" "$REF_STATUS" "$REF_NOTE" ;;
            referral_pdf)   python sync/referrals.py pdf "$REF_ID" ;;
            *) echo "unknown referral mode"; exit 1 ;;
          esac

      # 13.11.2026: שליחה ישירה מהג'ימייל של שאול. עד היום הכפתור "שלח"
      # רק סימן את השורה, והמייל יצא מהמשימה המתוזמנת עד שעה אחר כך.
      #
      # הסודות הם שלו ונוספו על ידו. הם לא מגיעים לשום מקום אחר, ושני
      # המצבים כאן הם היחידים שנוגעים בהם.
      # 15.11.2026: הגשות שנעשו ישירות באתר החברה, מתוך מייל האישור.
      # gmail_sync קורא רק את לינקדאין, ולכן אישור מ-Comeet או מ-Workday
      # לא נקרא אף פעם. אותם סודות של Send mail, ואותה תיבה.
      #
      # `ats_mail` מדפיס בלבד. `ats_mail_write` רושם. ההפרדה היא כי 556
      # ההגשות הן המכנה של "0.4 אחוז", ושורה שגויה כאן מזייפת אותו.
      # 15.11.2026: לוחות הקריירה של החברות. גוגל מגלה חברות, והלוח
      # עצמו מגלה משרות, כי האינדקס של גוגל ללוחות ATS ישן מאוד.
      # 15.11.2026: מי שכבר יש איתו שיחה בלינקדאין. ראה 0048.
      - name: Mark contacts with an existing LinkedIn thread
        if: inputs.mode == 'messaged'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CONTENT: ${{ inputs.content }}
        run: python sync/messaged_mark.py "$CONTENT"

      # 15.11.2026: גל מאי. אותו מצליב, עמודה אחרת. ראה 0049.
      - name: Mark contacts pitched in the May wave
        if: inputs.mode == 'pitched'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CONTENT: ${{ inputs.content }}
        run: python sync/messaged_mark.py "$CONTENT" first_pitch_at

      - name: Company career boards
        if: startsWith(inputs.mode, 'boards')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CONTENT: ${{ inputs.content }}
          TARGET: ${{ inputs.request_id }}
        run: |
          pip install curl_cffi >/dev/null 2>&1 || true
          case "${{ inputs.mode }}" in
            boards_probe) python sync/boards.py probe "$TARGET" ;;
            boards_add)   python sync/boards.py add "$CONTENT" ;;
            *)
              # האבחון יוצא ל-stderr ו-stdout הוא JSON נקי, ולכן זה
              # צינור ולא קובץ ביניים. seo_jobs מאמת כל שורה לפני
              # הכתיבה גם כאן, כרשת ביטחון: משרה מהלוח אמורה להיות
              # חיה בהגדרה, ומסלול שמניח ולא בודק הוא מה שהפיל כאן
              # דברים לאורך כל 2026.
              python sync/boards.py read > /tmp/boards.json
              python sync/seo_jobs.py "$(cat /tmp/boards.json)"
              python sync/score.py missing
              ;;
          esac

      # 23.11.2026: גילוי מערכת הגיוס של כל חברה ברשימה, וקריאת הלוחות שנמצאו.
      - name: Company ATS discovery and read
        if: startsWith(inputs.mode, 'ats_')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ARGS: ${{ inputs.content }}
        run: |
          case "${{ inputs.mode }}" in
            ats_discover) python sync/ats_discover.py $ARGS --write ;;
            *)
              python sync/ats_read.py > /tmp/ats.json
              python sync/seo_jobs.py "$(cat /tmp/ats.json)"
              python sync/score.py missing
              ;;
          esac

      - name: Applications from ATS confirmation mail
        if: startsWith(inputs.mode, 'ats_mail')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DAYS: ${{ inputs.request_id }}
        run: |
          ARGS=""
          if [ -n "$DAYS" ]; then ARGS="--days $DAYS"; fi
          if [ "${{ inputs.mode }}" = "ats_mail_write" ]; then ARGS="$ARGS --write"; fi
          python sync/ats_mail.py $ARGS

      # 17.11.2026: דחיות. אותו תבנית כמו ats_mail, ומאותה סיבה ההפרדה
      # בין הרצה שמדפיסה לבין הרצה שכותבת.
      - name: Rejections from mail
        if: startsWith(inputs.mode, 'rejections')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DAYS: ${{ inputs.request_id }}
        run: |
          ARGS=""
          if [ -n "$DAYS" ]; then ARGS="--days $DAYS"; fi
          if [ "${{ inputs.mode }}" = "rejections_write" ]; then ARGS="$ARGS --write"; fi
          python sync/rejections.py $ARGS

      - name: Send mail
        if: startsWith(inputs.mode, 'mail_')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          REF_ID: ${{ inputs.request_id }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          case "${{ inputs.mode }}" in
            mail_selftest) python sync/send_mail.py selftest ;;
            mail_test)     python sync/send_mail.py test "$REF_ID" ;;
            mail_send)     python sync/send_mail.py referrals ;;
            *) echo "unknown mail mode"; exit 1 ;;
          esac

      - name: Upload the attachment
        if: inputs.mode == 'referral_pdf'
        uses: actions/upload-artifact@v4
        with:
          name: referral-cv
          path: '*.pdf'
          if-no-files-found: error

      - name: Fetch the next pending request
        if: inputs.mode == 'fetch'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python sync/cv_requests.py fetch

      - name: Render and store the PDF
        if: inputs.mode == 'render'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CV_CONTENT: ${{ inputs.content }}
          CV_REQUEST_ID: ${{ inputs.request_id }}
          CV_FILENAME: ${{ inputs.filename }}
        run: |
          # דרך משתנה סביבה ולא דרך שורת הפקודה: התוכן הוא JSON עם מרכאות,
          # גרשים וסוגריים, ו-bash היה מפרק אותו.
          python -c "import os,io; io.open('content.json','w',encoding='utf-8').write(os.environ['CV_CONTENT'])"
          python sync/cv_requests.py render content.json "$CV_REQUEST_ID" "$CV_FILENAME"
