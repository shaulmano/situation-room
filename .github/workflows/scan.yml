name: Scan sources

# The scrapers are Python driving Chromium, which Vercel cannot run, so the
# button in the app dispatches this instead. Each source writes its row the
# moment it finishes, so the app's progress bar counts real work rather than
# animating while it waits.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: 'Space-separated source ids, or empty for all'
        required: false
        default: ''
      roles:
        description: 'Roles separated by |, or empty for the usual list'
        required: false
        default: ''
      manual:
        description: 'true to flag what is found as found by hand'
        required: false
        default: 'false'

concurrency:
  group: situation-room-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The scrapers live in the job-search repo and are read here rather than
      # copied, so a fix there reaches this scan without a second edit.
      - uses: actions/checkout@v4
        with:
          repository: shaulmano/shaul-job-search
          path: bot

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml curl_cffi playwright tzdata

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Scan
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          BOT_DIR: ${{ github.workspace }}/bot
          SCAN_SOURCES: ${{ inputs.sources }}
          SCAN_ROLES: ${{ inputs.roles }}
          SCAN_MANUAL: ${{ inputs.manual }}
        # דרך משתני סביבה ולא ישירות בשורה: שם תפקיד מכיל רווחים, והרחבה
        # של ${{ }} לתוך שורת הפקודה הייתה מפצלת אותו לשתי מילים.
        run: |
          # מרכיב את הארגומנטים ברשימה. ציטוט של משתנה ריק היה מעביר
          # ארגומנט ריק, ו-scan_sources היה קורא אותו כשם מקור.
          set -- $SCAN_SOURCES
          if [ -n "$SCAN_ROLES" ]; then set -- "$@" "--roles=$SCAN_ROLES"; fi
          if [ "$SCAN_MANUAL" = "true" ]; then set -- "$@" --manual; fi
          python sync/scan_sources.py "$@"

      # 10.11.2026: בלי זה המשרות נכנסות ל-jobs ונשארות בלתי נראות.
      # כל המסכים קוראים מ-matches עם jobs!inner, ו-scan_sources כותב רק
      # ל-jobs. החיפוש הידני הכניס 15 משרות ושאול לא ראה אף אחת. זאת אותה
      # מלכודת שתועדה ב-2.11 אחרי ה-KeyError בניקוד.
      - name: Score what came in
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python sync/score.py

      - name: Announce what arrived
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          pip install cryptography
          python sync/notify_push.py
