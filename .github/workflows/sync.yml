name: Sync from the bot

# The bot scrapes every 90 minutes and commits jobs.jsonl to its public repo.
# This pulls that file in rather than scraping everything a second time: half a
# minute and no browser, against fifteen minutes and a Chromium install — and
# it keeps the Supabase token out of the public repo, which is the other reason
# not to do this from the bot's own workflow.
#
# Offset by 20 minutes from the bot's schedule so it reads a finished commit
# rather than racing the run that is writing it.
# The bot dispatches this the moment it commits a new jobs.jsonl, so the
# schedule is no longer how postings arrive — it is the floor under a dispatch
# that never came, because the token expired or GitHub dropped the call.
#
# It used to run sixteen times a day and that was the only path in. Keeping
# sixteen alongside the dispatch would have doubled the runs to about 1,900
# minutes a month against a 2,000-minute quota on a private repo, and the
# month it ran out every sync would stop until the 1st.
#
# Three a day, in UTC. Israel is UTC+3 in summer and UTC+2 in winter, so these
# drift by an hour twice a year and nothing depends on the exact minute.
on:
  schedule:
    - cron: '10 2,10,18 * * *'
  workflow_dispatch:

concurrency:
  group: situation-room-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull the bot's job records into Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          python sync/jobs_sync.py \
            https://raw.githubusercontent.com/shaulmano/shaul-job-search/main/jobs.jsonl

      # Scoring is cheap and deterministic, and a job with no match row never
      # reaches the feed — so it has to run on whatever just arrived.
      - name: Score the new jobs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python sync/score.py

      - name: Announce what arrived
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          pip install cryptography
          python sync/notify_push.py
